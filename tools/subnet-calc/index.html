<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subnet Calculator — NetStatMan</title>
<meta name="description" content="Free visual CIDR subnet calculator with VLSM planner, subnet subdivision, and quick reference tables.">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #222633; --border: #2a2e3d;
    --text: #e4e4e7; --text-muted: #71717a; --accent: #00d4aa;
    --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6; --purple: #8b5cf6;
    --mono: 'JetBrains Mono', monospace; --font: 'Inter', sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; padding:24px; }

  .header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
  .logo-icon { width:36px; height:36px; background:linear-gradient(135deg, var(--accent), var(--blue));
    border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .logo span { font-size:18px; font-weight:700; }
  .header h1 { font-size:22px; font-weight:700; flex:1; }
  .header h1 em { color:var(--accent); font-style:normal; }
  .back { color:var(--text-muted); text-decoration:none; font-size:13px; padding:6px 12px;
    border:1px solid var(--border); border-radius:6px; transition:all 0.2s; }
  .back:hover { border-color:var(--accent); color:var(--text); }

  .input-row { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); }
  .field input, .field select {
    padding:10px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-family:var(--mono); font-size:15px; outline:none;
    transition:border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color:var(--accent); }
  .field input.error { border-color:var(--red); }
  .ip-input { width:200px; }
  .cidr-input { width:90px; }

  .btn { padding:10px 20px; background:var(--accent); border:none; color:#000; font-family:var(--font);
    font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; transition:all 0.2s; }
  .btn:hover { background:#00e6b8; transform:translateY(-1px); }

  /* Results */
  .results { display:none; }
  .results.show { display:block; }

  .result-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-bottom:24px; }
  .result-card {
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  }
  .result-card .label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:4px; }
  .result-card .value { font-family:var(--mono); font-size:16px; font-weight:500; word-break:break-all; }
  .result-card .value.small { font-size:13px; }
  .result-card .sub { font-size:11px; color:var(--text-muted); margin-top:2px; font-family:var(--mono); }

  /* Binary */
  .binary-section { margin-bottom:24px; }
  .binary-section h3 { font-size:14px; font-weight:600; margin-bottom:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
  .binary-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; font-family:var(--mono); font-size:13px; }
  .binary-label { width:120px; color:var(--text-muted); font-size:12px; text-align:right; flex-shrink:0; }
  .binary-bits { display:flex; gap:2px; }
  .binary-bits .octet { display:flex; gap:0; margin-right:8px; }
  .binary-bits .bit { width:14px; text-align:center; font-size:12px; }
  .bit.net { color:var(--accent); font-weight:600; }
  .bit.host { color:var(--blue); }
  .bit.sep { color:var(--border); width:4px; }

  /* Subnet Table */
  .subnet-table-wrap { margin-bottom:24px; overflow-x:auto; }
  .subnet-table-wrap h3 { font-size:14px; font-weight:600; margin-bottom:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
  table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px; }
  th { text-align:left; padding:8px 12px; color:var(--text-muted); font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border); }
  td { padding:8px 12px; border-bottom:1px solid rgba(42,46,61,0.5); }
  tr:hover td { background:var(--surface); }
  .highlight-row td { background:rgba(0,212,170,0.1); }

  /* VLSM Planner */
  .vlsm { margin-top:32px; padding-top:32px; border-top:1px solid var(--border); }
  .vlsm h2 { font-size:18px; font-weight:600; margin-bottom:4px; }
  .vlsm p { font-size:13px; color:var(--text-muted); margin-bottom:16px; }
  .vlsm-inputs { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .vlsm-row { display:flex; gap:8px; align-items:center; }
  .vlsm-row input { padding:8px 10px; background:var(--surface); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-family:var(--mono); font-size:13px; outline:none; }
  .vlsm-row input:focus { border-color:var(--accent); }
  .vlsm-row .name-input { width:160px; }
  .vlsm-row .hosts-input { width:100px; }
  .vlsm-remove { background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; padding:4px 8px; }
  .btn-sm { padding:6px 12px; font-size:12px; border-radius:6px; }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover { border-color:var(--accent); }

  /* Quick Ref */
  .quick-ref { margin-top:32px; padding-top:32px; border-top:1px solid var(--border); }
  .quick-ref h3 { font-size:14px; font-weight:600; margin-bottom:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
  .ref-table { width:100%; }
  .ref-table td { padding:4px 12px; font-family:var(--mono); font-size:12px; }
  .ref-table tr:nth-child(even) td { background:var(--surface); }

  .class-badge { font-size:10px; padding:2px 8px; border-radius:4px; font-weight:600; }
  .class-a { background:rgba(59,130,246,0.2); color:#60a5fa; }
  .class-b { background:rgba(168,85,247,0.2); color:#c084fc; }
  .class-c { background:rgba(34,197,94,0.2); color:#4ade80; }
  .class-private { background:rgba(0,212,170,0.2); color:#00d4aa; }

  footer { margin-top:48px; padding-top:24px; border-top:1px solid var(--border);
    text-align:center; font-size:13px; color:var(--text-muted); }
  footer a { color:var(--accent); text-decoration:none; }

  @media(max-width:768px) { .result-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">
    <div class="logo-icon">📡</div>
    <span>NetStatMan</span>
  </a>
  <h1>🧮 <em>Subnet</em> Calculator</h1>
  <a href="/" class="back">← All Tools</a>
</div>

<div class="input-row">
  <div class="field">
    <label>IP Address</label>
    <input type="text" id="ip" class="ip-input" value="192.168.1.0" placeholder="192.168.1.0">
  </div>
  <div class="field">
    <label>CIDR / Mask</label>
    <input type="text" id="cidr" class="cidr-input" value="24" placeholder="/24">
  </div>
  <button class="btn" onclick="calculate()">Calculate</button>
  <div class="field">
    <label>Subdivide into</label>
    <select id="subdivide" onchange="calculate()">
      <option value="0">No subdivision</option>
      <option value="2">2 subnets</option>
      <option value="4">4 subnets</option>
      <option value="8">8 subnets</option>
      <option value="16">16 subnets</option>
      <option value="32">32 subnets</option>
      <option value="64">64 subnets</option>
      <option value="128">128 subnets</option>
      <option value="256">256 subnets</option>
    </select>
  </div>
</div>

<div class="results" id="results">
  <div class="result-grid" id="result-grid"></div>
  <div class="binary-section" id="binary-section"></div>
  <div class="subnet-table-wrap" id="subnet-table"></div>
</div>

<!-- VLSM Planner -->
<div class="vlsm">
  <h2>📐 VLSM Planner</h2>
  <p>Define subnets by name and host count — auto-allocates optimal subnet sizes from a given network.</p>
  <div class="input-row">
    <div class="field">
      <label>Network</label>
      <input type="text" id="vlsm-network" class="ip-input" value="10.0.0.0" placeholder="10.0.0.0">
    </div>
    <div class="field">
      <label>CIDR</label>
      <input type="text" id="vlsm-cidr" class="cidr-input" value="16" placeholder="/16">
    </div>
  </div>
  <div class="vlsm-inputs" id="vlsm-inputs">
    <div class="vlsm-row">
      <input class="name-input" placeholder="Subnet name" value="Servers">
      <input class="hosts-input" type="number" placeholder="Hosts" value="50">
      <button class="vlsm-remove" onclick="removeVlsm(this)">✕</button>
    </div>
    <div class="vlsm-row">
      <input class="name-input" placeholder="Subnet name" value="Users">
      <input class="hosts-input" type="number" placeholder="Hosts" value="200">
      <button class="vlsm-remove" onclick="removeVlsm(this)">✕</button>
    </div>
    <div class="vlsm-row">
      <input class="name-input" placeholder="Subnet name" value="Management">
      <input class="hosts-input" type="number" placeholder="Hosts" value="10">
      <button class="vlsm-remove" onclick="removeVlsm(this)">✕</button>
    </div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-sm btn-outline" onclick="addVlsm()">+ Add Subnet</button>
    <button class="btn btn-sm" onclick="calcVlsm()">Calculate VLSM</button>
  </div>
  <div id="vlsm-results" style="margin-top:16px"></div>
</div>

<!-- Quick Reference -->
<div class="quick-ref">
  <h3>📋 CIDR Quick Reference</h3>
  <table class="ref-table" id="ref-table"></table>
</div>

<footer>
  <p>© 2026 <a href="/">NetStatMan</a> — Free tools for network professionals</p>
</footer>

<script>
// ── IP Math ──
function ipToLong(ip) {
  return ip.split('.').reduce((a,o)=>(a<<8)+parseInt(o), 0) >>> 0;
}
function longToIp(n) {
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}
function toBinary(n, pad=8) {
  return n.toString(2).padStart(pad, '0');
}
function ipToBinary(ip) {
  return ip.split('.').map(o => toBinary(parseInt(o))).join('');
}
function isValidIp(ip) {
  const parts = ip.split('.');
  if(parts.length !== 4) return false;
  return parts.every(p => { const n=parseInt(p); return !isNaN(n) && n>=0 && n<=255 && p===String(n); });
}
function getClass(ip) {
  const first = parseInt(ip.split('.')[0]);
  if(first < 128) return 'A';
  if(first < 192) return 'B';
  if(first < 224) return 'C';
  if(first < 240) return 'D';
  return 'E';
}
function isPrivate(ip) {
  const n = ipToLong(ip);
  return (n >= ipToLong('10.0.0.0') && n <= ipToLong('10.255.255.255')) ||
         (n >= ipToLong('172.16.0.0') && n <= ipToLong('172.31.255.255')) ||
         (n >= ipToLong('192.168.0.0') && n <= ipToLong('192.168.255.255'));
}
function formatNumber(n) {
  return n.toLocaleString();
}

// ── Main Calculation ──
function calculate() {
  const ipVal = document.getElementById('ip').value.trim();
  let cidrVal = document.getElementById('cidr').value.trim().replace('/','');
  const cidr = parseInt(cidrVal);
  const subdivide = parseInt(document.getElementById('subdivide').value);

  document.getElementById('ip').classList.remove('error');
  if(!isValidIp(ipVal)) {
    document.getElementById('ip').classList.add('error');
    return;
  }
  if(isNaN(cidr) || cidr < 0 || cidr > 32) return;

  const mask = cidr === 0 ? 0 : (0xFFFFFFFF << (32-cidr)) >>> 0;
  const wildcard = (~mask) >>> 0;
  const network = (ipToLong(ipVal) & mask) >>> 0;
  const broadcast = (network | wildcard) >>> 0;
  const totalHosts = Math.pow(2, 32-cidr);
  const usableHosts = cidr >= 31 ? (cidr === 32 ? 1 : 2) : totalHosts - 2;
  const firstHost = cidr >= 31 ? network : network + 1;
  const lastHost = cidr >= 31 ? broadcast : broadcast - 1;
  const ipClass = getClass(longToIp(network));
  const priv = isPrivate(longToIp(network));

  // Result cards
  const grid = document.getElementById('result-grid');
  grid.innerHTML = `
    <div class="result-card">
      <div class="label">Network Address</div>
      <div class="value">${longToIp(network)}/${cidr}</div>
    </div>
    <div class="result-card">
      <div class="label">Subnet Mask</div>
      <div class="value">${longToIp(mask)}</div>
      <div class="sub">/${cidr}</div>
    </div>
    <div class="result-card">
      <div class="label">Wildcard Mask</div>
      <div class="value">${longToIp(wildcard)}</div>
    </div>
    <div class="result-card">
      <div class="label">Broadcast Address</div>
      <div class="value">${longToIp(broadcast)}</div>
    </div>
    <div class="result-card">
      <div class="label">First Usable Host</div>
      <div class="value">${longToIp(firstHost)}</div>
    </div>
    <div class="result-card">
      <div class="label">Last Usable Host</div>
      <div class="value">${longToIp(lastHost)}</div>
    </div>
    <div class="result-card">
      <div class="label">Usable Hosts</div>
      <div class="value">${formatNumber(usableHosts)}</div>
      <div class="sub">Total addresses: ${formatNumber(totalHosts)}</div>
    </div>
    <div class="result-card">
      <div class="label">IP Class / Type</div>
      <div class="value">
        <span class="class-badge class-${ipClass.toLowerCase()}">${ipClass}</span>
        ${priv ? '<span class="class-badge class-private" style="margin-left:6px">Private</span>' : '<span class="class-badge" style="background:rgba(239,68,68,0.2);color:#f87171;margin-left:6px">Public</span>'}
      </div>
    </div>
  `;

  // Binary breakdown
  const netBin = ipToBinary(longToIp(network));
  const maskBin = ipToBinary(longToIp(mask));
  const bcastBin = ipToBinary(longToIp(broadcast));

  function renderBinary(bits, cidrLen) {
    let html = '<div class="binary-bits">';
    for(let i=0; i<32; i++) {
      if(i>0 && i%8===0) html += '<span class="bit sep">.</span>';
      html += `<span class="bit ${i<cidrLen?'net':'host'}">${bits[i]}</span>`;
    }
    html += '</div>';
    return html;
  }

  document.getElementById('binary-section').innerHTML = `
    <h3>Binary Breakdown</h3>
    <div class="binary-row"><span class="binary-label">Network</span>${renderBinary(netBin, cidr)}</div>
    <div class="binary-row"><span class="binary-label">Mask</span>${renderBinary(maskBin, cidr)}</div>
    <div class="binary-row"><span class="binary-label">Broadcast</span>${renderBinary(bcastBin, cidr)}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px;margin-left:128px">
      <span style="color:var(--accent)">■</span> Network bits &nbsp;
      <span style="color:var(--blue)">■</span> Host bits
    </div>
  `;

  // Subdivision table
  const stDiv = document.getElementById('subnet-table');
  if(subdivide > 0) {
    const newBits = Math.ceil(Math.log2(subdivide));
    const newCidr = cidr + newBits;
    if(newCidr > 30) {
      stDiv.innerHTML = '<p style="color:var(--red)">Cannot subdivide — not enough host bits.</p>';
    } else {
      const subSize = Math.pow(2, 32-newCidr);
      const actualSubs = Math.pow(2, newBits);
      let html = `<h3>Subnets (/${newCidr} — ${actualSubs} subnets, ${formatNumber(subSize-2)} hosts each)</h3>
        <table><tr><th>#</th><th>Network</th><th>First Host</th><th>Last Host</th><th>Broadcast</th><th>Hosts</th></tr>`;
      for(let i=0; i<actualSubs && i<256; i++) {
        const subNet = network + (i * subSize);
        const subBcast = subNet + subSize - 1;
        const contains = ipToLong(ipVal) >= subNet && ipToLong(ipVal) <= subBcast;
        html += `<tr class="${contains?'highlight-row':''}">
          <td>${i+1}</td>
          <td>${longToIp(subNet)}/${newCidr}</td>
          <td>${longToIp(subNet+1)}</td>
          <td>${longToIp(subBcast-1)}</td>
          <td>${longToIp(subBcast)}</td>
          <td>${formatNumber(subSize-2)}</td>
        </tr>`;
      }
      html += '</table>';
      stDiv.innerHTML = html;
    }
  } else {
    stDiv.innerHTML = '';
  }

  document.getElementById('results').classList.add('show');
}

// ── VLSM ──
function addVlsm() {
  const row = document.createElement('div');
  row.className = 'vlsm-row';
  row.innerHTML = `
    <input class="name-input" placeholder="Subnet name">
    <input class="hosts-input" type="number" placeholder="Hosts">
    <button class="vlsm-remove" onclick="removeVlsm(this)">✕</button>
  `;
  document.getElementById('vlsm-inputs').appendChild(row);
}
function removeVlsm(btn) {
  const rows = document.querySelectorAll('.vlsm-row');
  if(rows.length <= 1) return;
  btn.parentElement.remove();
}
function calcVlsm() {
  const netIp = document.getElementById('vlsm-network').value.trim();
  const netCidr = parseInt(document.getElementById('vlsm-cidr').value.trim().replace('/',''));
  if(!isValidIp(netIp) || isNaN(netCidr)) return;

  const rows = document.querySelectorAll('.vlsm-row');
  let subnets = [];
  rows.forEach(r => {
    const name = r.querySelector('.name-input').value.trim() || 'Unnamed';
    const hosts = parseInt(r.querySelector('.hosts-input').value) || 0;
    if(hosts > 0) subnets.push({ name, hosts });
  });

  // Sort by hosts descending (largest first)
  subnets.sort((a,b) => b.hosts - a.hosts);

  const netMask = netCidr === 0 ? 0 : (0xFFFFFFFF << (32-netCidr)) >>> 0;
  const netAddr = (ipToLong(netIp) & netMask) >>> 0;
  const netEnd = (netAddr | (~netMask >>> 0)) >>> 0;

  let currentAddr = netAddr;
  let results = [];
  let error = '';

  for(const sub of subnets) {
    // Find smallest CIDR that fits
    const needed = sub.hosts + 2; // network + broadcast
    const hostBits = Math.ceil(Math.log2(needed));
    const subCidr = 32 - hostBits;
    const subSize = Math.pow(2, hostBits);

    // Align to subnet boundary
    const alignedAddr = (Math.ceil(currentAddr / subSize) * subSize) >>> 0;

    if(alignedAddr + subSize - 1 > netEnd) {
      error = `Not enough space for "${sub.name}" (needs ${sub.hosts} hosts). Address space exhausted.`;
      break;
    }

    const subBcast = (alignedAddr + subSize - 1) >>> 0;
    results.push({
      name: sub.name,
      network: longToIp(alignedAddr),
      cidr: subCidr,
      mask: longToIp((0xFFFFFFFF << (32-subCidr)) >>> 0),
      firstHost: longToIp(alignedAddr + 1),
      lastHost: longToIp(subBcast - 1),
      broadcast: longToIp(subBcast),
      usable: subSize - 2,
      requested: sub.hosts,
      waste: subSize - 2 - sub.hosts
    });
    currentAddr = alignedAddr + subSize;
  }

  let html = '';
  if(error) html += `<p style="color:var(--red);margin-bottom:12px">⚠️ ${error}</p>`;
  if(results.length) {
    html += `<table><tr><th>Name</th><th>Network</th><th>Mask</th><th>Range</th><th>Usable</th><th>Requested</th><th>Waste</th></tr>`;
    results.forEach(r => {
      html += `<tr>
        <td style="font-family:var(--font);font-weight:500">${r.name}</td>
        <td>${r.network}/${r.cidr}</td>
        <td>${r.mask}</td>
        <td class="value small">${r.firstHost} — ${r.lastHost}</td>
        <td>${formatNumber(r.usable)}</td>
        <td>${formatNumber(r.requested)}</td>
        <td style="color:${r.waste>r.requested*0.5?'var(--yellow)':'var(--green)'}">${formatNumber(r.waste)}</td>
      </tr>`;
    });
    html += '</table>';
    // Summary
    const totalUsed = results.reduce((a,r) => a + r.usable + 2, 0);
    const totalAvail = Math.pow(2, 32-netCidr);
    const pct = ((totalUsed/totalAvail)*100).toFixed(1);
    html += `<p style="font-size:12px;color:var(--text-muted);margin-top:8px">Used: ${formatNumber(totalUsed)} / ${formatNumber(totalAvail)} addresses (${pct}%)</p>`;
  }
  document.getElementById('vlsm-results').innerHTML = html;
}

// ── Quick Reference Table ──
function buildRefTable() {
  const table = document.getElementById('ref-table');
  let html = '<tr><th>CIDR</th><th>Mask</th><th>Wildcard</th><th>Addresses</th><th>Usable Hosts</th></tr>';
  for(let c=32; c>=8; c--) {
    const mask = c===0?0:(0xFFFFFFFF<<(32-c))>>>0;
    const wild = (~mask)>>>0;
    const total = Math.pow(2,32-c);
    const usable = c>=31?(c===32?1:2):total-2;
    html += `<tr>
      <td>/${c}</td>
      <td>${longToIp(mask)}</td>
      <td>${longToIp(wild)}</td>
      <td>${formatNumber(total)}</td>
      <td>${formatNumber(usable)}</td>
    </tr>`;
  }
  table.innerHTML = html;
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (document.activeElement.id === 'ip' || document.activeElement.id === 'cidr')) {
    calculate();
  }
});

// Init
